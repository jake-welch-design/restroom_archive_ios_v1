name: RestroomArchive
options:
  bundleIdPrefix: com.restroomarchive
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  ArchiveCore:
    path: Packages/ArchiveCore

targets:
  RestroomArchive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RestroomArchive
        excludes:
          - "Resources/**"
          - "RestroomArchive.entitlements"
      - path: RestroomArchive/Resources/Assets.xcassets
      - path: RestroomArchive/Resources/StageDist
        type: folder
        buildPhase: resources
    info:
      path: RestroomArchive/Resources/Info.plist
    entitlements:
      path: RestroomArchive/RestroomArchive.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restroomarchive.ios
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: RestroomArchive/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RestroomArchive/RestroomArchive.entitlements
    dependencies:
      - package: ArchiveCore
        product: ArchiveCore
      - target: RestroomShareExtension
        embed: true

  RestroomShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RestroomShareExtension/ShareViewController.swift
    info:
      path: RestroomShareExtension/Info.plist
    entitlements:
      path: RestroomShareExtension/RestroomShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restroomarchive.ios.share
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: RestroomShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: RestroomShareExtension/RestroomShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: ArchiveCore
        product: ArchiveCore

