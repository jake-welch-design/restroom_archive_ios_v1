<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Archive Stage</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      #stage-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #stage-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #stage-canvas.create-mode {
        cursor: crosshair;
      }

      #markers-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .marker-pin {
        position: absolute;
        left: 0;
        top: 0;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        margin-top: -11px;
        border: 1px solid #000;
        background: #fff;
        color: #000;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        line-height: 20px;
        text-align: center;
        padding: 0;
        pointer-events: auto;
        cursor: pointer;
        will-change: transform;
      }

      .marker-pin.active {
        background: #000;
        color: #fff;
        border-color: #fff;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="stage-root">
      <canvas id="stage-canvas"></canvas>
      <div id="markers-layer"></div>
    </div>
    <script type="module" src="./stage.js"></script>
  </body>
</html>
